[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
]

[tee]
enabled = true
mode = "failures"
max_files = 20
max_file_size = 1048576

[telemetry]
enabled = false
consent_given = false
consent_date = "2026-06-09T08:04:31.408081919+00:00"

[hooks]
# rg -> `rtk grep` is a broken mapping: rtk grep wraps GNU grep, which has
# incompatible flag grammar (no --glob, no implicit recursion) and exits 0
# on error, so failed searches look like clean "no matches" results.
#
# diff -> observed reporting "[ok] Files are identical" for two files whose
# md5sums differed and whose contents visibly differed (2026-07-20, kitbag).
# Plain /usr/bin/diff is correct on the same inputs. Sabotage testing confirms
# a mutation was reverted before running the next one, so a false "identical"
# lets a mutation survive and silently corrupts every measurement after it.
exclude_commands = ["rg", "diff"]
transparent_prefixes = []

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000
