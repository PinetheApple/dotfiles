general {
    lock_cmd = pidof hyprlock || hyprlock          # avoid spawning multiple
    before_sleep_cmd = loginctl lock-session        # lock BEFORE suspend
    after_sleep_cmd = ~/.config/hypr/resume-displays.sh  # ordered DPMS recovery after wake
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = ~/.config/hypr/resume-displays.sh
}

# 10 min: suspend (save battery)
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
